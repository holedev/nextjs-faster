allowBuilds:
  '@parcel/watcher': true   # file watching cho Next.js dev
  '@prisma/engines': true   # bắt buộc cho Prisma
  '@scarf/scarf': false     # telemetry tracker, không cần
  '@swc/core': true         # Next.js compiler
  '@tree-sitter-grammars/tree-sitter-yaml': false  # optional, Biome không cần
  core-js-pure: false       # polyfill, không cần build script
  prisma: true              # bắt buộc cho Prisma CLI
  sharp: true               # image optimization Next.js
  tree-sitter: false        # optional
  tree-sitter-json: false   # optional
  unrs-resolver: true       # dependency của Biome/ultracite, cần build